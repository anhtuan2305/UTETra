# ==========================================
# CẤU HÌNH SERVER & MÃ HÓA UTF-8 TOÀN HỆ THỐNG
# ==========================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ==========================================
# CẤU HÌNH KẾT NỐI SQL SERVER (TÀI KHOẢN SA)
# Đã thêm: sendStringParametersAsUnicode=true;characterEncoding=UTF-8
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=utetra_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CẤU HÌNH THYMELEAF (UTF-8 & TẮT CACHE ĐỂ CODE GIAO DIỆN NHẬN NGAY)
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ==========================================
# CẤU HÌNH GỬI MAIL (GMAIL SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tungnemc@gmail.com
spring.mail.password=loox ffup dxki pmdw
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true