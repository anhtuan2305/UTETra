<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Đơn Hàng - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            color: #333;
            min-height: 100vh;
            margin: 0;
            background-color: #0d2847;
            background-image: url('/images/wave-bg.png');
            background-repeat: repeat-y;
            background-position: center top;
            background-size: 100% auto;
            background-attachment: scroll;
        }

        .checkout-box {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            padding: 2.5rem;
        }

        .order-summary-sidebar {
            background-color: #f8faff;
            border: 1px solid #d0e2ff;
            border-radius: 16px;
            padding: 1.5rem;
        }

        .item-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="checkout-box">
            
            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center">
                    <i class="bi bi-shield-check fs-2 me-3" style="color: #004ea2;"></i>
                    <h3 class="fw-bold mb-0" style="color: #004ea2;">XÁC NHẬN VÀ ĐẶT HÀNG</h3>
                </div>
                <span th:if="${!isLoggedIn}" class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-semibold">
                    <i class="bi bi-person-fill-slash me-1"></i> Khách vãng lai
                </span>
            </div>

            <form th:action="@{/checkout/place-order}" th:object="${checkoutDTO}" method="post">
                <div class="row g-5">
                    
                    <!-- Cột trái: Thông tin chọn quán & Giao nhận -->
                    <div class="col-12 col-lg-7">
                        
                        <!-- 1. Chọn Chi Nhánh Quán -->
                        <h5 class="fw-bold mb-3" style="color: #004ea2;"><i class="bi bi-shop me-2"></i>Chi Nhánh Pha Chế</h5>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Chọn chi nhánh quán phục vụ <span class="text-danger">*</span></label>
                            <select class="form-select form-select-lg rounded-3" th:field="*{shopId}" required>
                                <option value="" disabled selected>-- Chọn chi nhánh gần bạn nhất --</option>
                                <option th:each="s : ${shops}" 
                                        th:value="${s.id}" 
                                        th:text="${s.shopName}">
                                    UTETra - Thủ Đức
                                </option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('shopId')}" th:errors="*{shopId}"></div>
                            <div class="form-text small text-muted">Đơn hàng sẽ được chuyển đến chi nhánh này chuẩn bị và giao đi.</div>
                        </div>

                        <!-- 2. Thông tin Địa Chỉ Nhận Hàng -->
                        <h5 class="fw-bold mb-3 mt-4" style="color: #004ea2;"><i class="bi bi-geo-alt me-2"></i>Địa Chỉ Nhận Hàng</h5>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ và tên người nhận <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{receiverName}" class="form-control" placeholder="Nguyễn Văn A" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="0912345678" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ chi tiết (Số nhà, tên đường, phường/xã) <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{streetAddress}" class="form-control" placeholder="Số 1 Võ Văn Ngân, P. Linh Chiểu" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('streetAddress')}" th:errors="*{streetAddress}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tỉnh / Thành phố <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{city}" class="form-control" value="TP. Hồ Chí Minh" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Ghi chú cho quán (tuỳ chọn)</label>
                            <input type="text" th:field="*{note}" class="form-control" placeholder="Ghi chú thêm về đơn hàng hoặc dặn dò Shipper...">
                        </div>

                        <!-- 3. Phương Thức Thanh Toán -->
                        <h5 class="fw-bold mb-3 mt-4" style="color: #004ea2;"><i class="bi bi-wallet2 me-2"></i>Phương Thức Thanh Toán</h5>
                        
                        <div class="p-3 border rounded-3 mb-2 d-flex align-items-center">
                            <input class="form-check-input me-3" type="radio" th:field="*{paymentMethod}" id="payCOD" value="COD" checked>
                            <label class="form-check-label w-100" for="payCOD">
                                <strong>Thanh toán khi nhận hàng (COD)</strong>
                                <div class="text-muted small">Nhận trà sữa tận tay rồi mới trả tiền mặt cho Shipper</div>
                            </label>
                        </div>

                        <div class="p-3 border rounded-3 mb-4 d-flex align-items-center">
                            <input class="form-check-input me-3" type="radio" th:field="*{paymentMethod}" id="payVNPAY" value="VNPAY">
                            <label class="form-check-label w-100" for="payVNPAY">
                                <strong>Ví điện tử VNPAY / Thẻ ATM QR</strong>
                                <div class="text-muted small">Quét mã VNPAY-QR thanh toán tức thì qua App ngân hàng</div>
                            </label>
                        </div>
                    </div>

                    <!-- Cột phải: Xem lại giỏ & Tổng thanh toán -->
                    <div class="col-12 col-lg-5">
                        <div class="order-summary-sidebar">
                            <h5 class="fw-bold mb-3" style="color: #004ea2;">ĐƠN TRÀ SỮA CỦA BẠN</h5>
                            
                            <div class="list-group list-group-flush mb-3">
                                <div class="list-group-item bg-transparent px-0 py-2 d-flex align-items-center" th:each="item : ${cart.items}">
                                    <img th:src="${item.product.imageUrl}" class="item-thumb me-3" alt="">
                                    <div class="flex-grow-1">
                                        <div class="fw-semibold small" th:text="${item.product.name}">Tên món</div>
                                        <div class="text-muted" style="font-size: 0.75rem;" th:text="${item.optionsJson}">Size M</div>
                                        <div class="small">Số lượng: <strong th:text="${item.quantity}">1</strong></div>
                                    </div>
                                    <div class="text-danger fw-bold small" 
                                         th:text="${#numbers.formatDecimal(item.product.basePrice * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    </div>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between mb-2 small">
                                <span class="text-secondary">Tạm tính:</span>
                                <span class="fw-semibold" th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-3 small">
                                <span class="text-secondary">Phí giao hàng:</span>
                                <span class="fw-semibold" th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between align-items-baseline mb-4">
                                <span class="fw-bold">Tổng thanh toán:</span>
                                <span class="fw-bold fs-4 text-danger" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 py-3 rounded-pill fw-bold shadow" style="background-color: #d8232a;">
                                <i class="bi bi-check-circle me-2"></i> ĐẶT HÀNG NGAY
                            </button>
                        </div>
                    </div>

                </div>
            </form>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
