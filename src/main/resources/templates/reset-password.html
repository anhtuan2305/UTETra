<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0d2847; background-image: url('/images/wave-bg.png'); background-attachment: scroll; background-size: 100% auto; min-height: 100vh; display: flex; align-items: center; font-family: 'Montserrat', sans-serif;}
        .card-auth { border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: none; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); }
    </style>
</head>
<body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-auth p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-danger fs-1 mb-2"></i>
                    <h4 class="fw-bold" style="color: #004ea2;">Đặt Lại Mật Khẩu</h4>
                    <p class="text-muted small">Mã xác nhận đã được gửi đến: <strong th:text="${email}"></strong></p>
                </div>
                
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" name="email" th:value="${email}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mã OTP (6 chữ số)</label>
                        <input type="text" name="otp" class="form-control text-center fs-5 fw-bold" maxlength="6" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Mật khẩu mới</label>
                        <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold" style="background-color: #d8232a;">Lưu Mật Khẩu Mới</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="/js/live-orders.js"></script></body>
</html>
