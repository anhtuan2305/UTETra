<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Đơn Hàng - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0d2847; 
            background-image: url('/images/wave-bg.png');
            background-repeat: repeat-y;
            background-position: center top;
            background-size: 100% auto;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .lookup-card { 
            background: #fff; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.35); 
            padding: 2.5rem; 
            max-width: 460px; 
            width: 100%; 
        }
    </style>
</head>
<body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}">

    <div class="lookup-card m-3">
        <div class="text-center mb-4">
            <i class="bi bi-receipt-cutoff" style="font-size: 3rem; color: #004ea2;"></i>
            <h4 class="fw-bold mt-2" style="color: #004ea2;">Tra Cứu Đơn Hàng</h4>
            <p class="text-muted small">Dành cho khách hàng chưa đăng nhập tài khoản</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

        <form th:action="@{/orders/lookup}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã đơn hàng (Order ID)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                    <input type="number" name="orderId" th:value="${orderId}" class="form-control" placeholder="Ví dụ: 6" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Số điện thoại nhận hàng</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="tel" name="phone" th:value="${phone}" class="form-control" placeholder="Ví dụ: 0912345678" required>
                </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 rounded-pill fw-bold text-uppercase shadow-sm" style="background-color: #d8232a;">
                <i class="bi bi-search me-1"></i> Kiểm tra tình trạng
            </button>
        </form>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Quay lại trang chủ</a>
        </div>
    </div>

<script src="/js/live-orders.js"></script></body>
</html>
