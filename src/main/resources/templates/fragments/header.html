<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<header th:fragment="header" class="sticky-top bg-white shadow-sm border-bottom">
    <div class="container py-2">
        <div class="row align-items-center">
            
            <!-- 1. Logo UTETra Wujiatea Style -->
            <div class="col-6 col-lg-3 d-flex align-items-center">
                <a th:href="@{/}" class="text-decoration-none d-flex align-items-center">
                    <div class="me-2 text-start">
                        <div class="fw-bold text-uppercase d-flex align-items-center" style="color: #004ea2; font-family: 'Montserrat', sans-serif; letter-spacing: 1.5px; font-size: 1.35rem;">
                            <i class="bi bi-cup-hot-fill text-danger me-2"></i>UTETRA
                        </div>
                        <small class="text-secondary fw-semibold" style="font-size: 0.65rem; display: block; letter-spacing: 1px;">TRÀ TRUYỀN THỐNG ĐÀI LOAN</small>
                    </div>
                </a>
            </div>

            <!-- 2. Thanh tìm kiếm sản phẩm trà -->
            <div class="col-12 col-lg-5 my-2 my-lg-0 order-3 order-lg-2">
                <form th:action="@{/}" method="get" class="d-flex">
                    <div class="input-group">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control border-2 border-primary-subtle rounded-start-pill ps-3" placeholder="Tìm kiếm vị trà, topping, quán gần bạn...">
                        <button class="btn btn-primary rounded-end-pill px-4" style="background-color: #004ea2; border-color: #004ea2;" type="submit">
                            <i class="bi bi-search"></i> Tìm
                        </button>
                    </div>
                </form>
            </div>

            <!-- 3. Giỏ hàng & Menu Tài khoản theo Role -->
            <div class="col-6 col-lg-4 text-end order-2 order-lg-3 d-flex justify-content-end align-items-center gap-3">
                
                <!-- Icon Giỏ hàng (chống co ép bằng flex-shrink: 0) -->
                <a th:href="@{/cart}" class="btn btn-light position-relative rounded-circle p-2 border shadow-sm flex-shrink-0" style="width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;">
                    <i class="bi bi-cart3 fs-5" style="color: #004ea2;"></i>
                    <span th:if="${cartItemCount != null and cartItemCount > 0}" 
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                          th:text="${cartItemCount}">
                        0
                    </span>
                </a>

                <!-- Trạng thái: Chưa đăng nhập -->
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2 flex-shrink-0">
                    <a th:href="@{/login}" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-bold" style="border-color: #004ea2; color: #004ea2;">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn btn-danger btn-sm rounded-pill px-3 fw-bold" style="background-color: #d8232a;">Đăng ký</a>
                </div>

                <!-- Trạng thái: Đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="dropdown flex-shrink-1" style="min-width: 0;">
                    <button class="btn btn-sm btn-outline-primary dropdown-toggle rounded-pill px-3 fw-bold d-inline-flex align-items-center text-truncate" 
                            style="border-color: #004ea2; color: #004ea2; max-width: 220px;" 
                            type="button" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false"
                            th:title="${#authentication.name}">
                        <i class="bi bi-person-circle me-1 flex-shrink-0"></i>
                        <span class="text-truncate" sec:authentication="name">Tài khoản</span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a></li>
                        <li><a class="dropdown-item py-2" th:href="@{/orders}"><i class="bi bi-receipt me-2"></i>Đơn mua hàng</a></li>

                        <!-- Dành riêng cho SHIPPER -->
                        <li sec:authorize="hasRole('SHIPPER')">
                            <hr class="dropdown-divider">
                            <a class="dropdown-item py-2 text-warning fw-bold text-dark" th:href="@{/shipper/orders}">
                                <i class="bi bi-bicycle me-2 text-warning"></i>Kênh Giao Hàng (Shipper)
                            </a>
                        </li>

                        <!-- Dành riêng cho VENDOR (Chủ Quán) -->
                        <li sec:authorize="hasRole('VENDOR')">
                            <hr class="dropdown-divider">
                            <a class="dropdown-item py-2 text-primary fw-bold" th:href="@{/vendor/dashboard}">
                                <i class="bi bi-shop me-2"></i>Kênh Quán Shop
                            </a>
                        </li>

                        <!-- Dành riêng cho ADMIN (Quản Trị Viên) -->
                        <li sec:authorize="hasRole('ADMIN')">
                            <hr class="dropdown-divider">
                            <a class="dropdown-item py-2 text-danger fw-bold" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>Kênh Admin Quản Trị
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item py-2 text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <!-- Thanh Menu danh mục điều hướng -->
    <nav class="navbar navbar-expand bg-light py-1 border-top" style="font-size: 0.9rem;">
        <div class="container justify-content-center">
            <ul class="navbar-nav gap-4 text-uppercase fw-bold">
                <li class="nav-item"><a class="nav-link active" th:href="@{/}" style="color: #004ea2;">Trang Chủ</a></li>
                <li class="nav-item"><a class="nav-link text-dark" th:href="@{/#productList}">Sản Phẩm Nổi Bật</a></li>
                <li class="nav-item"><a class="nav-link text-dark" th:href="@{/#shopsList}">Hệ Thống Gian Hàng</a></li>
                <li class="nav-item"><a class="nav-link text-dark" th:href="@{/#storySection}">Câu Chuyện UTETra</a></li>
                <li class="nav-item"><a class="nav-link text-danger" th:href="@{/register}">Hợp Tác Mở Quán</a></li>
            </ul>
        </div>
    </nav>
</header>
</body>
</html>
