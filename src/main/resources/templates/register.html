<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - UTETra</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #fff3e0);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .btn-brand {
            background-color: #ff6b35;
            color: white;
            font-weight: 600;
        }
        .btn-brand:hover {
            background-color: #e85922;
            color: white;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card register-card p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark"><i class="bi bi-cup-hot-fill text-warning me-2"></i>UTETra</h2>
                    <p class="text-muted">Đăng ký tài khoản trải nghiệm trà sữa đỉnh cao</p>
                </div>

                <!-- Báo lỗi nghiệp vụ nếu có -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert" th:text="${errorMessage}"></div>

                <form th:action="@{/register}" th:object="${registerDTO}" method="post">
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="name@example.com">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- Mật khẩu -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                        <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <!-- Xác nhận mật khẩu -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>

                    <!-- Chọn vai trò -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Bạn muốn đăng ký với tư cách?</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{role}" id="roleUser" value="USER" checked>
                                <label class="form-check-label" for="roleUser">Khách hàng</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{role}" id="roleVendor" value="VENDOR">
                                <label class="form-check-label" for="roleVendor">Chủ quán (Shop)</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-brand w-100 py-2">Đăng Ký Ngay</button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted">Đã có tài khoản?</span>
                    <a th:href="@{/login}" class="text-decoration-none fw-semibold text-primary"> Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
