<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khách hàng và tài khoản | UTETra</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/console.css"></head><body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}"><nav><a href="/">UTETra</a><a href="/console/dashboard">Tổng quan</a><a href="/console/products">Thực đơn</a><a href="/console/orders">Đơn hàng</a><a href="/console/promotions">Khuyến mãi</a><a href="/console/users">Khách hàng</a><a href="/console/settings">Cài đặt</a><a th:if="${role == 'ADMIN'}" href="/admin/shops">Duyệt quán</a><a th:if="${role == 'ADMIN'}" href="/admin/shippers">Duyệt Shipper</a></nav><main><h1>Khách hàng và tài khoản</h1><section><form method="get"><input name="keyword" placeholder="Tìm email"><button>Tìm</button></form><p class="muted">Manager chỉ thấy khách đã mua ở chi nhánh được phân công. Quyền khóa tài khoản toàn hệ thống thuộc Admin.</p><div class="scroll"><table><tr><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr><tr th:each="a:${users}"><td th:text="${a.email}"></td><td th:text="${a.role}"></td><td th:text="${a.isActive ? 'Hoạt động' : 'Chờ duyệt / khóa'}"></td><td><form th:if="${role == 'ADMIN' and !#strings.contains(a.role,'ADMIN')}" th:action="@{/admin/users/toggle-status}" method="post"><input type="hidden" name="userId" th:value="${a.id}"><button>Đổi trạng thái</button></form></td></tr></table></div></section></main><script src="/js/live-orders.js"></script></body></html>
