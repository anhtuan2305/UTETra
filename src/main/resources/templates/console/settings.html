<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cửa hàng & cấu hình | UTETra</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/console.css"></head><body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}"><nav><a href="/">UTETra</a><a href="/console/dashboard">Tổng quan</a><a href="/console/products">Thực đơn</a><a href="/console/orders">Đơn hàng</a><a href="/console/promotions">Khuyến mãi</a><a href="/console/users">Khách hàng</a><a href="/console/settings">Cài đặt</a><a th:if="${role == 'ADMIN'}" href="/admin/shops">Duyệt quán</a><a th:if="${role == 'ADMIN'}" href="/admin/shippers">Duyệt Shipper</a></nav><main><h1>Cửa hàng & cấu hình</h1><section th:each="s:${shops}"><h2 th:text="${s.shopName}"></h2><form th:action="@{/console/shop}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" th:value="${s.id}"><label>Tên quán</label><input name="name" th:value="${s.shopName}" required><label>Giới thiệu</label><textarea name="description" th:text="${s.description}"></textarea><label>Logo</label><input type="file" name="logo" accept="image/png,image/jpeg,image/webp"><button>Lưu thông tin quán</button></form><form th:if="${role == 'ADMIN'}" th:action="@{/console/assignment}" method="post"><input type="hidden" name="shopId" th:value="${s.id}"><label>Manager phụ trách</label><select name="managerId"><option value="">Chưa phân công</option><option th:each="a:${managers}" th:value="${a.id}" th:text="${a.email}" th:selected="${s.manager != null and s.manager.id == a.id}"></option></select><label>Chiết khấu ứng dụng (%)</label><input type="number" name="commission" min="0" max="100" step="0.01" th:value="${s.commissionPercent}" required><button>Lưu phân công &amp; chiết khấu</button></form></section><div th:if="${role == 'ADMIN'}"><section><h2>Tạo tài khoản Manager</h2><form th:action="@{/console/managers}" method="post" ><label>Email</label><input type="email" name="email" required><label>Mật khẩu tạm thời (8–72 ký tự)</label><input type="password" name="password" required minlength="8" maxlength="72"><button>Tạo Manager</button></form></section><section><h2>Danh mục</h2><form th:action="@{/console/categories}" method="post" ><label>Tên danh mục mới</label><input type="text" name="name" required maxlength="100"><button>Thêm</button></form><form th:each="c:${categories}" th:action="@{/console/categories}" method="post"><input type="hidden" name="id" th:value="${c.id}"><input name="name" th:value="${c.name}" required><button>Đổi tên</button></form></section><section><h2>Nhà vận chuyển</h2><form th:action="@{/console/carriers}" method="post" ><label>Tên đơn vị mới</label><input type="text" name="name" required><label>Phí giao hàng (đ)</label><input type="number" name="fee" required min="0"><input type="hidden" name="active" value="true"><button>Thêm</button></form><form th:each="c:${carriers}" th:action="@{/console/carriers}" method="post"><input type="hidden" name="id" th:value="${c.id}"><label>Tên</label><input name="name" th:value="${c.name}" required><label>Phí</label><input type="number" name="fee" th:value="${c.baseFee}" min="0" required><label><input type="checkbox" name="active" value="true" th:checked="${c.isActive}"> Hoạt động</label><button>Lưu</button></form></section></div><section th:if="${role == 'MANAGER' or role == 'ADMIN'}" th:each="s:${shops}"><h2 th:text="${'Danh mục & vận chuyển riêng: ' + s.shopName}"></h2><form th:action="@{/console/categories}" method="post"><input type="hidden" name="shopId" th:value="${s.id}"><label>Thêm danh mục của chi nhánh</label><input name="name" maxlength="100" required><button>Thêm danh mục</button></form><form th:each="c:${categories}" th:if="${c.shop != null and c.shop.id == s.id}" th:action="@{/console/categories}" method="post"><input type="hidden" name="shopId" th:value="${s.id}"><input type="hidden" name="id" th:value="${c.id}"><input name="name" th:value="${c.name}" required><button>Đổi tên</button></form><form th:action="@{/console/carriers}" method="post"><input type="hidden" name="shopId" th:value="${s.id}"><label>Nhà vận chuyển riêng</label><input name="name" required><label>Phí giao (đ)</label><input type="number" name="fee" min="0" required><input type="hidden" name="active" value="true"><button>Thêm vận chuyển</button></form><form th:each="c:${carriers}" th:if="${c.shop != null and c.shop.id == s.id}" th:action="@{/console/carriers}" method="post"><input type="hidden" name="shopId" th:value="${s.id}"><input type="hidden" name="id" th:value="${c.id}"><input name="name" th:value="${c.name}" required><input type="number" name="fee" th:value="${c.baseFee}" min="0" required><label><input type="checkbox" name="active" value="true" th:checked="${c.isActive}"> Hoạt động</label><button>Lưu vận chuyển</button></form></section></main><script src="/js/live-orders.js"></script></body></html>
