
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý thực đơn | UTETra</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/console.css">
</head>

<body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}">

<nav>
    <a href="/">UTETra</a>
    <a href="/console/dashboard">Tổng quan</a>
    <a href="/console/products">Thực đơn</a>
    <a href="/console/orders">Đơn hàng</a>
    <a href="/console/promotions">Khuyến mãi</a>
    <a href="/console/users">Khách hàng</a>
    <a href="/console/settings">Cài đặt</a>

    <a th:if="${role == 'ADMIN'}" href="/admin/shops">
        Duyệt quán
    </a>

    <a th:if="${role == 'ADMIN'}" href="/admin/shippers">
        Duyệt Shipper
    </a>
</nav>

<main>

    <h1>Quản lý thực đơn</h1>

    <!-- FORM THÊM / SỬA SẢN PHẨM -->
    <section>

        <h2 th:text="${editProduct != null} ? 'Chỉnh sửa món' : 'Thêm món mới'">
            Thêm món mới
        </h2>

        <form th:action="@{/console/products}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="id"
                   th:value="${editProduct?.id}">

            <label>Mã sản phẩm (tự động)</label>

            <input type="text"
                   th:value="${editProduct != null ? editProduct.id : 'Tự động tạo khi lưu'}"
                   readonly>

            <label>Chi nhánh</label>

            <select name="shopId" required>
                <option th:each="s : ${shops}"
                        th:value="${s.id}"
                        th:text="${s.shopName}"
                        th:selected="${editProduct != null and editProduct.shop != null and editProduct.shop.id == s.id}">
                </option>
            </select>

            <label>Danh mục</label>

            <select name="categoryId" required>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${editProduct != null and editProduct.category != null and editProduct.category.id == c.id}">
                </option>
            </select>

            <label>Tên món</label>

            <input type="text"
                   name="name"
                   required
                   maxlength="150"
                   placeholder="Nhập tên món"
                   th:value="${editProduct?.name}">

            <label>Giá cơ bản (đ)</label>

            <input type="number"
                   name="price"
                   required
                   min="1"
                   max="10000000"
                   th:value="${editProduct?.basePrice}">

            <label>Tồn kho</label>

            <input type="number"
                   name="stock"
                   required
                   min="0"
                   th:value="${editProduct?.stock}">

            <label>Mô tả</label>

            <textarea name="description"
                      maxlength="4000"
                      placeholder="Nhập mô tả món"
                      th:text="${editProduct?.description}">
            </textarea>

            <label>Trạng thái sản phẩm</label>

            <select name="status">

                <option value="ACTIVE"
                        th:selected="${editProduct == null or editProduct.status == 'ACTIVE'}">
                    Đang bán
                </option>

                <option value="HIDDEN"
                        th:selected="${editProduct != null and editProduct.status == 'HIDDEN'}">
                    Tạm ngừng bán
                </option>

                <option value="OUT_OF_STOCK"
                        th:selected="${editProduct != null and editProduct.status == 'OUT_OF_STOCK'}">
                    Hết hàng
                </option>

            </select>

            <label>Ảnh món (PNG, JPEG, WebP - tối đa 10 MB)</label>

            <input type="file"
                   name="image"
                   accept="image/png,image/jpeg,image/webp">

            <button type="submit">
                Lưu món
            </button>

            <a th:if="${editProduct != null}"
               href="/console/products"
               class="btn btn-outline-secondary">
                Hủy chỉnh sửa
            </a>

        </form>

    </section>

    <!-- DANH SÁCH SẢN PHẨM -->
    <section>

        <h2>Danh sách món</h2>

        <form method="get" th:action="@{/console/products}">

            <input type="text"
                   name="keyword"
                   placeholder="Tìm tên món"
                   th:value="${param.keyword}">

            <button type="submit">
                Tìm kiếm
            </button>

        </form>

        <div class="scroll">

            <table>

                <thead>
                <tr>
                    <th>Món</th>
                    <th>Chi nhánh</th>
                    <th>Giá</th>
                    <th>Tồn kho</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${products == null or #lists.isEmpty(products)}">
                    <td colspan="6" style="text-align:center;">
                        Chưa có sản phẩm nào.
                    </td>
                </tr>

                <tr th:each="p : ${products}">

                    <td th:text="${p.name}">
                        Tên món
                    </td>

                    <td th:text="${p.shop != null ? p.shop.shopName : 'Chưa có chi nhánh'}">
                        Chi nhánh
                    </td>

                    <td th:text="${#numbers.formatDecimal(p.basePrice, 0, 'POINT', 0, 'COMMA') + ' đ'}">
                        0 đ
                    </td>

                    <td th:text="${p.stock}">
                        0
                    </td>

                    <td>

                        <span th:if="${p.status == 'ACTIVE'}"
                              class="badge bg-success">
                            Đang bán
                        </span>

                        <span th:if="${p.status == 'HIDDEN'}"
                              class="badge bg-secondary">
                            Tạm ngừng bán
                        </span>

                        <span th:if="${p.status == 'OUT_OF_STOCK'}"
                              class="badge bg-danger">
                            Hết hàng
                        </span>

                        <span th:unless="${p.status == 'ACTIVE' or p.status == 'HIDDEN' or p.status == 'OUT_OF_STOCK'}"
                              th:text="${p.status}">
                            Trạng thái khác
                        </span>

                    </td>

                    <td>

                        <a th:href="@{/console/products(edit=${p.id})}">
                            Sửa
                        </a>

                        <form th:if="${p.status != 'HIDDEN'}"
                              th:action="@{/console/products/{id}/hide(id=${p.id})}"
                              method="post"
                              style="display:inline-block;">

                            <button type="submit"
                                    onclick="return confirm('Bạn có chắc muốn ngừng bán món này?')">
                                Ngừng bán
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="/js/live-orders.js"></script>

</body>
</html>
