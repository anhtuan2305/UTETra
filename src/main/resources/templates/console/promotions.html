<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khuyến mãi | UTETra</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/console.css"></head><body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}"><nav><a href="/">UTETra</a><a href="/console/dashboard">Tổng quan</a><a href="/console/products">Thực đơn</a><a href="/console/orders">Đơn hàng</a><a href="/console/promotions">Khuyến mãi</a><a href="/console/users">Khách hàng</a><a href="/console/settings">Cài đặt</a><a th:if="${role == 'ADMIN'}" href="/admin/shops">Duyệt quán</a><a th:if="${role == 'ADMIN'}" href="/admin/shippers">Duyệt Shipper</a></nav><main><h1>Khuyến mãi</h1><section><form th:action="@{/console/promotions}" method="post" ><label></label><input type="hidden" name="id" th:value="${editPromotion?.id}"><label>Phạm vi</label><select name="shopId"><option th:if="${role == 'ADMIN'}" value="">Toàn hệ thống</option><option th:each="s:${shops}" th:value="${s.id}" th:text="${s.shopName}" th:selected="${editPromotion != null and editPromotion.shop != null and editPromotion.shop.id == s.id}"></option></select><label>Mã giảm giá</label><input type="text" name="code" required pattern="[A-Za-z0-9_-]{3,50}" th:value="${editPromotion?.code}"><label>Phần trăm giảm</label><input type="number" name="percent" required min="1" max="100" th:value="${editPromotion?.discountPercent}"><label>Giảm tối đa (đ)</label><input type="number" name="max" required min="0" th:value="${editPromotion?.maxDiscount}"><label>Đơn tối thiểu (đ)</label><input type="number" name="min" required min="0" th:value="${editPromotion?.minOrderAmount}"><label>Loại giảm giá</label><select name="type"><option value="PRODUCT">Giảm tiền món</option><option value="SHIPPING" th:selected="${editPromotion != null and editPromotion.type == 'SHIPPING'}">Giảm phí giao hàng</option></select><label>Hết hạn (để trống nếu không giới hạn)</label><input type="datetime-local" name="expiry" th:value="${editPromotion?.expiresAt}"><label><input type="checkbox" name="active" value="true" th:checked="${editPromotion == null or editPromotion.isActive}"> Đang áp dụng</label><button>Lưu khuyến mãi</button></form></section><section><table><tr><th>Mã</th><th>Loại</th><th>Giảm</th><th>Trạng thái</th><th></th></tr><tr th:each="p:${promotions}"><td th:text="${p.code}"></td><td th:text="${p.type}"></td><td th:text="${p.discountPercent + '%'}"></td><td th:text="${p.isActive ? 'Bật' : 'Tắt'}"></td><td><a th:href="@{/console/promotions(edit=${p.id})}">Sửa / tắt</a></td></tr></table></section></main><script src="/js/live-orders.js"></script></body></html>
