<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #fff3e0);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .otp-card {
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .btn-brand {
            background-color: #ff6b35;
            color: white;
            font-weight: 600;
        }
        .btn-brand:hover {
            background-color: #e85922;
            color: white;
        }
        .otp-input {
            letter-spacing: 0.5rem;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card otp-card p-4 p-md-5 bg-white text-center">
                <div class="mb-3">
                    <i class="bi bi-shield-lock-fill text-warning fs-1"></i>
                </div>
                <h3 class="fw-bold mb-2">Nhập Mã OTP</h3>
                <p class="text-muted small">
                    Mã kích hoạt 6 chữ số đã được gửi tới hòm thư:<br>
                    <strong class="text-dark" th:text="${email}">user@example.com</strong>
                </p>

                <!-- Báo lỗi mã sai/hết hạn -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert" th:text="${errorMessage}"></div>

                <form th:action="@{/verify-otp}" method="post" class="mt-3">
                    <input type="hidden" name="email" th:value="${email}">
                    <div class="mb-3">
                        <input type="text" name="otp" class="form-control otp-input" maxlength="6" placeholder="------" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-brand w-100 py-2">Xác Thực & Kích Hoạt</button>
                </form>

                <div class="mt-4 small text-muted">
                    Không nhận được mã? Hãy kiểm tra cả hộp thư Rác (Spam).
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
