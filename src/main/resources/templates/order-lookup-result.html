<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Đơn Hàng #[[${order.id}]] - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .box { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 2rem; }
    </style>
</head>
<body>
    <div class="container my-5" style="max-width: 750px;">
        <div class="box">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                <h4 class="fw-bold mb-0 text-primary">Đơn Hàng #[[${order.id}]]</h4>
                <span class="badge bg-warning text-dark px-3 py-2 rounded-pill" th:text="${order.status}">NEW</span>
            </div>

            <div class="mb-4">
                <p class="mb-1"><strong>Người nhận:</strong> <span th:text="${order.guestName != null ? order.guestName : order.address.receiverName}"></span></p>
                <p class="mb-1"><strong>Số điện thoại:</strong> <span th:text="${order.guestPhone != null ? order.guestPhone : order.address.phone}"></span></p>
                <p class="mb-1"><strong>Địa chỉ giao:</strong> <span th:text="${order.guestAddress != null ? order.guestAddress : (order.address.streetAddress + ', ' + order.address.city)}"></span></p>
                <p class="mb-0"><strong>Thanh toán:</strong> <span th:text="${order.paymentMethod}"></span> (<span th:text="${order.paymentStatus}"></span>)</p>
            </div>

            <h6 class="fw-bold border-bottom pb-2">Danh sách món</h6>
            <div class="list-group list-group-flush mb-3">
                <div class="list-group-item px-0 d-flex justify-content-between" th:each="detail : ${order.orderDetails}">
                    <div>
                        <div class="fw-bold" th:text="${detail.productName}">Trà Sữa</div>
                        <small class="text-muted" th:text="${detail.optionsSnapshot}"></small>
                        <div class="small">Số lượng: <strong th:text="${detail.quantity}"></strong></div>
                    </div>
                    <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(detail.unitPrice * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>
            </div>

            <div class="d-flex justify-content-between fs-5 fw-bold border-top pt-3">
                <span>Tổng cộng:</span>
                <span class="text-danger" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
            </div>

            <div class="mt-4 text-center">
                <a th:href="@{/orders/lookup}" class="btn btn-outline-secondary rounded-pill px-4">Tra cứu đơn khác</a>
                <a th:href="@{/}" class="btn btn-primary rounded-pill px-4 ms-2">Về trang chủ</a>
            </div>
        </div>
    </div>
</body>
</html>
