<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doanh Thu Quán - UTETra Vendor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8fafc; min-height: 100vh; }
        .vendor-box { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 2rem; }
        .metric-card { border-radius: 14px; padding: 1.5rem; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="vendor-box shadow-sm">
            
            <!-- Thanh điều hướng trên cùng -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div>
                    <a th:href="@{/vendor/dashboard}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left"></i> Quay lại Dashboard
                    </a>
                    <h4 class="fw-bold text-primary mb-0 mt-1">
                        <i class="bi bi-cash-stack me-2"></i>Doanh Thu Bán Hàng
                    </h4>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/vendor/orders}" class="btn btn-outline-primary rounded-pill px-3 fw-bold btn-sm">
                        <i class="bi bi-receipt me-1"></i> Quản Lý Đơn
                    </a>
                </div>
            </div>

            <!-- 2 Khối tóm tắt: Tổng doanh thu và Tổng số đơn hoàn tất -->
            <div class="row g-4 mb-4">
                <div class="col-12 col-md-6">
                    <div class="metric-card border-start border-4 border-danger">
                        <span class="text-muted small fw-bold text-uppercase">Tổng Doanh Thu Tất Cả Các Ngày</span>
                        <h2 class="fw-bold mb-0 text-danger mt-1" 
                            th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h2>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="metric-card border-start border-4 border-primary">
                        <span class="text-muted small fw-bold text-uppercase">Số Đơn Hàng Hoàn Tất</span>
                        <h2 class="fw-bold mb-0 text-primary mt-1" th:text="${totalCompletedOrders}">0</h2>
                    </div>
                </div>
            </div>

            <!-- Bảng Thống Kê Doanh Thu Theo Từng Ngày -->
            <div class="border rounded-4 p-3 bg-white">
                <h6 class="fw-bold text-dark mb-3">
                    <i class="bi bi-calendar-check me-2 text-primary"></i>Chi Tiết Doanh Thu Theo Ngày
                </h6>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Ngày Bán</th>
                                <th>Số Đơn Hoàn Tất</th>
                                <th class="text-end">Doanh Thu Trong Ngày</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#maps.isEmpty(dailyRevenueMap)}">
                                <td colspan="3" class="text-center text-muted py-4">Chưa có doanh thu từ đơn hàng hoàn tất nào.</td>
                            </tr>
                            <tr th:each="entry : ${dailyRevenueMap}">
                                <td class="fw-bold text-dark">
                                    <i class="bi bi-calendar3 me-2 text-muted"></i>
                                    <span th:text="${#temporals.format(entry.key, 'dd/MM/yyyy')}">01/01/2026</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border px-3 py-2">
                                        [[${dailyOrderCountMap.get(entry.key)}]] đơn
                                    </span>
                                </td>
                                <td class="fw-bold text-danger text-end fs-6" 
                                    th:text="${#numbers.formatDecimal(entry.value, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    0 đ
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
