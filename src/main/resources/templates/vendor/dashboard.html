<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kênh Quản Lý Quán - UTETra Vendor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8fafc; min-height: 100vh; }
        .vendor-box { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 2rem; }
        .metric-card { border-radius: 14px; padding: 1.5rem; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="vendor-box shadow-sm">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div class="d-flex align-items-center gap-3">
                    <img th:src="${shop.logoUrl}" class="rounded-circle border" style="width: 55px; height: 55px; object-fit: cover;" alt="">
                    <div>
                        <h4 class="fw-bold mb-0 text-primary" th:text="${shop.shopName}">Tên Quán</h4>
                        <small class="text-muted" th:text="${shop.description}">Mô tả</small>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/vendor/products}" class="btn btn-outline-primary rounded-pill px-3 fw-bold">
                        <i class="bi bi-cup-hot me-1"></i> Quản Lý Món
                    </a>
                    <a th:href="@{/vendor/orders}" class="btn btn-primary rounded-pill px-3 fw-bold" style="background-color: #004ea2;">
                        <i class="bi bi-receipt me-1"></i> Đơn Hàng Của Quán
                    </a>
                    <a th:href="@{/vendor/finances}" class="btn btn-outline-danger rounded-pill px-3 fw-bold">
                        <i class="bi bi-cash-stack me-1"></i> Doanh Thu
                    </a>
                </div>
            </div>

            <!-- Thống kê nhanh -->
            <div class="row g-4 mb-4">
                <div class="col-6 col-md-4">
                    <div class="metric-card border-start border-4 border-primary">
                        <span class="text-muted small fw-bold text-uppercase">Món Đang Bán</span>
                        <h2 class="fw-bold mb-0 text-primary mt-1" th:text="${totalProducts}">0</h2>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="metric-card border-start border-4 border-success">
                        <span class="text-muted small fw-bold text-uppercase">Tổng Đơn Hàng</span>
                        <h2 class="fw-bold mb-0 text-success mt-1" th:text="${totalOrders}">0</h2>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="metric-card border-start border-4 border-warning">
                        <span class="text-muted small fw-bold text-uppercase">Đánh Giá Cửa Hàng</span>
                        <h2 class="fw-bold mb-0 text-warning mt-1">
                            <i class="bi bi-star-fill text-warning fs-4"></i> [[${shop.rating}]]
                        </h2>
                    </div>
                </div>
            </div>

            <!-- Đơn hàng gần nhất -->
            <div class="border rounded-4 p-3 bg-white">
                <h6 class="fw-bold text-dark mb-3"><i class="bi bi-clock-history me-2 text-primary"></i>Đơn Hàng Gần Đây</h6>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Mã Đơn</th>
                                <th>Thời Gian</th>
                                <th>Khách Hàng</th>
                                <th>Tổng Tiền</th>
                                <th>Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(recentOrders)}">
                                <td colspan="5" class="text-center text-muted py-3">Chưa có đơn hàng nào.</td>
                            </tr>
                            <tr th:each="o : ${recentOrders}">
                                <td class="fw-bold text-primary">#[[${o.id}]]</td>
                                <td class="small" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                                <td th:text="${o.address.receiverName}">Tên người nhận</td>
                                <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                                <td><span class="badge bg-secondary" th:text="${o.status}">NEW</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
