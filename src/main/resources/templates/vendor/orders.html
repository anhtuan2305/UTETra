<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Kênh Quán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/vendor/dashboard}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> Quay lại Dashboard</a>
                <h4 class="fw-bold text-primary mb-0 mt-1"><i class="bi bi-receipt me-2"></i>Đơn Hàng Của Quán</h4>
            </div>
            <a th:href="@{/vendor/orders}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-clockwise me-1"></i> Làm mới
            </a>
        </div>

        <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

        <div class="bg-white rounded-4 shadow-sm p-4 border">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Mã Đơn</th>
                            <th>Thời Gian</th>
                            <th>Người Nhận</th>
                            <th>Địa Chỉ Nhận</th>
                            <th>Tổng Tiền</th>
                            <th>Trạng Thái</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center text-muted py-4">Chưa có đơn hàng nào từ khách.</td>
                        </tr>
                        <tr th:each="o : ${orders}">
                            <td class="fw-bold text-primary">#[[${o.id}]]</td>
                            <td class="small" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                            <td th:text="${o.address.receiverName} + ' (' + ${o.address.phone} + ')'">Khách</td>
                            <td class="small text-muted" th:text="${o.address.streetAddress} + ', ' + ${o.address.city}">Địa chỉ</td>
                            <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                            <td>
                                <span th:if="${o.status == 'NEW'}" class="badge bg-warning text-dark">Chờ Quán Xác Nhận</span>
                                <span th:if="${o.status == 'PREPARING'}" class="badge bg-info text-dark">Đang Pha Chế</span>
                                <span th:if="${o.status == 'SHIPPING'}" class="badge bg-primary">Shipper Đang Giao</span>
                                <span th:if="${o.status == 'COMPLETED'}" class="badge bg-success">Hoàn Tất</span>
                            </td>
                            <td>
                                <form th:if="${o.status == 'NEW'}" th:action="@{/vendor/orders/update-status}" method="post" class="d-inline">
                                    <input type="hidden" name="orderId" th:value="${o.id}">
                                    <input type="hidden" name="status" value="PREPARING">
                                    <button type="submit" class="btn btn-sm btn-success rounded-pill px-3 fw-bold">
                                        <i class="bi bi-check-lg me-1"></i> Xác Nhận Làm Món
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
