<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Món - UTETra Vendor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f8fafc; min-height: 100vh; }
        .vendor-box { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 2rem; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="vendor-box shadow-sm">
            
            <!-- Header điều hướng -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div>
                    <a th:href="@{/vendor/dashboard}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left"></i> Quay lại Dashboard
                    </a>
                    <h4 class="fw-bold text-primary mb-0 mt-1">
                        <i class="bi bi-cup-hot me-2"></i>Thực Đơn Của Quán
                    </h4>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary rounded-pill px-3 fw-bold" style="background-color: #004ea2;" onclick="openAddProductModal()">
                        <i class="bi bi-plus-circle me-1"></i> Thêm Món Mới
                    </button>
                    <a th:href="@{/vendor/orders}" class="btn btn-outline-primary rounded-pill px-3 fw-bold">
                        <i class="bi bi-receipt me-1"></i> Đơn Hàng Của Quán
                    </a>
                </div>
            </div>

            <!-- Thông báo -->
            <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <!-- Bảng danh sách món -->
            <div class="border rounded-4 p-3 bg-white">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Ảnh</th>
                                <th>Tên Món</th>
                                <th>Mô Tả</th>
                                <th>Đơn Giá</th>
                                <th>Trạng Thái</th>
                                <th class="text-end">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="6" class="text-center text-muted py-4">Quán chưa có món nào trong thực đơn.</td>
                            </tr>
                            <tr th:each="p : ${products}">
                                <td>
                                    <img th:src="${p.imageUrl != null and !p.imageUrl.isEmpty() ? (p.imageUrl.startsWith('http') or p.imageUrl.startsWith('/') ? p.imageUrl : '/' + p.imageUrl) : 'https://placehold.co/100x100?text=Tea'}" 
                                         onerror="this.onerror=null; this.src='https://placehold.co/100x100?text=Tea';"
                                         class="rounded-3 border" style="width: 50px; height: 50px; object-fit: cover;" alt="Ảnh món">
                                </td>
                                <td class="fw-bold text-dark" th:text="${p.name}">Trà Sữa Khoai Môn Hoàng Kim</td>
                                <td class="small text-muted" style="max-width: 250px;" th:text="${p.description}">Mô tả món</td>
                                <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(p.basePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">35,000 đ</td>
                                <td>
                                    <span th:if="${p.status == 'ACTIVE'}" class="badge bg-success-subtle text-success border border-success">Đang Bán</span>
                                    <span th:unless="${p.status == 'ACTIVE'}" class="badge bg-danger-subtle text-danger border border-danger">Hết Món</span>
                                </td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-2 me-1" 
                                            th:data-id="${p.id}"
                                            th:data-name="${p.name}"
                                            th:data-price="${p.basePrice}"
                                            th:data-desc="${p.description}"
                                            th:data-img="${p.imageUrl}"
                                            th:data-status="${p.status}"
                                            onclick="openEditProductModal(this)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form th:action="@{/vendor/products/delete}" method="post" class="d-inline"
                                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa món này?');">
                                        <input type="hidden" name="productId" th:value="${p.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-2">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Thêm / Chỉnh Sửa Món Cho Vendor -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <form th:action="@{/vendor/products/save}" method="post">
                    <div class="modal-header border-bottom">
                        <h5 class="modal-title fw-bold text-primary" id="modalTitle">Chỉnh Sửa Món</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" name="id" id="prodId">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tên Món *</label>
                            <input type="text" name="name" id="prodName" class="form-control" required placeholder="Nhập tên món trà sữa...">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Đơn Giá (VNĐ) *</label>
                            <input type="number" step="1000" name="basePrice" id="prodPrice" class="form-control" required placeholder="Ví dụ: 35000">
                        </div>

                        <!-- Khung ảnh chỉ xem (Read-only) -->
                        <div class="mb-3" id="previewContainer">
                            <label class="form-label small fw-bold text-muted d-block">
                                <i class="bi bi-image me-1"></i>Hình Ảnh Món (Hình ảnh do Quản trị viên kiểm duyệt)
                            </label>
                            <div class="text-center p-2 bg-light border rounded-3">
                                <img id="imagePreview" src="" class="rounded border shadow-sm" style="max-height: 120px; object-fit: contain;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mô Tả</label>
                            <textarea name="description" id="prodDesc" class="form-control" rows="2" placeholder="Ghi chú thành phần, hương vị..."></textarea>
                        </div>

                        <!-- Trạng thái: ACTIVE / INACTIVE -->
                        <input type="hidden" name="status" id="statusHidden" value="ACTIVE">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="prodAvailableSwitch" checked onchange="toggleStatus(this.checked)">
                            <label class="form-check-label small fw-bold text-success" for="prodAvailableSwitch" id="statusLabel">Còn món (Đang mở bán)</label>
                        </div>
                    </div>
                    <div class="modal-footer border-top">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold" style="background-color: #004ea2; border: none;">Lưu Thông Tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function toggleStatus(isChecked) {
            const hiddenInput = document.getElementById('statusHidden');
            const label = document.getElementById('statusLabel');
            if (isChecked) {
                hiddenInput.value = 'ACTIVE';
                label.textContent = 'Còn món (Đang mở bán)';
                label.className = 'form-check-label small fw-bold text-success';
            } else {
                hiddenInput.value = 'INACTIVE';
                label.textContent = 'Hết món (Ngừng bán)';
                label.className = 'form-check-label small fw-bold text-danger';
            }
        }

        function openAddProductModal() {
            document.getElementById('modalTitle').textContent = 'Thêm Món Mới';
            document.getElementById('prodId').value = '';
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodDesc').value = '';
            
            // Khi thêm món mới tạm ẩn khung xem ảnh
            document.getElementById('previewContainer').style.display = 'none';
            
            document.getElementById('prodAvailableSwitch').checked = true;
            toggleStatus(true);

            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        function openEditProductModal(btn) {
            document.getElementById('modalTitle').textContent = 'Chỉnh Sửa Món';
            document.getElementById('prodId').value = btn.getAttribute('data-id');
            document.getElementById('prodName').value = btn.getAttribute('data-name');
            document.getElementById('prodPrice').value = btn.getAttribute('data-price');
            document.getElementById('prodDesc').value = btn.getAttribute('data-desc') || '';

            // Hiển thị ảnh đại diện hiện tại của món
            const currentImg = btn.getAttribute('data-img');
            const previewContainer = document.getElementById('previewContainer');
            const previewImg = document.getElementById('imagePreview');
            
            if (currentImg && currentImg.trim() !== '') {
                previewImg.src = currentImg;
                previewContainer.style.display = 'block';
            } else {
                previewImg.src = 'https://placehold.co/100x100?text=Tea';
                previewContainer.style.display = 'block';
            }

            // Đồng bộ công tắc trạng thái
            const status = btn.getAttribute('data-status');
            const isActive = (status === 'ACTIVE');
            document.getElementById('prodAvailableSwitch').checked = isActive;
            toggleStatus(isActive);

            new bootstrap.Modal(document.getElementById('productModal')).show();
        }
    </script>
</body>
</html>
