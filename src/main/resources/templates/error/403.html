
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Không có quyền truy cập | UTETra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f7f4;
            font-family: Arial, sans-serif;
            color: #123d32;
        }

        .card {
            background: white;
            padding: 55px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 560px;
            width: 90%;
            box-shadow: 0 12px 35px rgba(0,0,0,.08);
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
            color: #007b58;
        }

        .code {
            font-size: 100px;
            font-weight: 800;
            color: #e63946;
            margin: 25px 0 0;
        }

        h1 {
            font-size: 27px;
            margin: 10px 0;
        }

        p {
            color: #66736e;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 26px;
            border-radius: 10px;
            background: #007b58;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #005f44;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">UTETra</div>

        <div class="code">403</div>

        <h1>Không có quyền truy cập</h1>

        <p>
            Bạn không có quyền chỉnh sửa sản phẩm
            hoặc truy cập chức năng này.
            Vui lòng sử dụng tài khoản có quyền phù hợp.
        </p>

        <a href="/console">Quay về trang quản lý</a>
    </div>

</body>
</html>
