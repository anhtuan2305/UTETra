<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UTETra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d2847;
            background-image: url('/images/wave-bg.png');
            background-repeat: repeat-y;
            background-position: center top;
            background-size: 100% auto;
            background-attachment: scroll;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: none;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }

        .brand-title {
            color: #004ea2;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .btn-wujia-login {
            background-color: #ff5722;
            border-color: #ff5722;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.25s ease;
        }

        .btn-wujia-login:hover {
            background-color: #d8232a;
            border-color: #d8232a;
            color: white;
            transform: translateY(-2px);
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo & Header -->
        <div class="text-center mb-4">
            <div class="d-flex justify-content-center align-items-center gap-2 mb-1">
                <i class="bi bi-cup-hot-fill fs-3 text-warning"></i>
                <h3 class="brand-title mb-0">UTETRA</h3>
            </div>
            <p class="text-secondary small">Đăng nhập tài khoản của bạn</p>
        </div>

        <!-- Thông báo Đăng xuất thành công -->
        <div th:if="${param.logout}" class="alert alert-info py-2 px-3 small border-0 rounded-3">
            <i class="bi bi-info-circle me-1"></i> Bạn đã đăng xuất an toàn.
        </div>

        <!-- Thông báo Đăng nhập thất bại -->
        <div th:if="${param.error}" class="alert alert-danger py-2 px-3 small border-0 rounded-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Sai email hoặc mật khẩu!
        </div>

        <!-- Thông báo Đổi mật khẩu thành công -->
        <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small border-0 rounded-3" th:text="${successMessage}">
        </div>

        <!-- Form Đăng nhập -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Email</label>
                <input type="email" name="username" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-bold text-secondary mb-0">Mật khẩu</label>
                    <!-- ĐÃ LIÊN KẾT CHÍNH XÁC VÀO TRANG QUÊN MẬT KHẨU -->
                    <a th:href="@{/forgot-password}" class="text-decoration-none small text-muted">Quên mật khẩu?</a>
                </div>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-wujia-login w-100 mt-2 shadow-sm">
                Đăng Nhập
            </button>
        </form>

        <!-- Điều hướng sang trang Đăng ký -->
        <div class="text-center mt-4 pt-2 border-top">
            <span class="small text-muted">Chưa có tài khoản? </span>
            <a th:href="@{/register}" class="small fw-bold text-primary text-decoration-none">Đăng ký ngay</a>
        </div>
    </div>

</body>
</html>
