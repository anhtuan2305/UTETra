<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #fff3e0);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .btn-brand {
            background-color: #ff6b35;
            color: white;
            font-weight: 600;
        }
        .btn-brand:hover {
            background-color: #e85922;
            color: white;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card login-card p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark"><i class="bi bi-cup-hot-fill text-warning me-2"></i>UTETra</h2>
                    <p class="text-muted">Đăng nhập tài khoản của bạn</p>
                </div>

                <!-- Báo kích hoạt thành công -->
                <div th:if="${successMessage}" class="alert alert-success py-2" role="alert" th:text="${successMessage}"></div>

                <!-- Báo đăng nhập thất bại -->
                <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                    Email hoặc mật khẩu không chính xác, hoặc tài khoản chưa được kích hoạt!
                </div>

                <!-- Báo đăng xuất -->
                <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
                    Bạn đã đăng xuất an toàn.
                </div>

                <!-- Form login mặc định của Spring Security (action là /login, method POST) -->
                <form th:action="@{/login}" method="post">
                    <!-- Username ở đây chính là Email -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Email</label>
                        <input type="email" name="username" class="form-control" id="username" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Mật khẩu</label>
                            <a href="#" class="text-decoration-none small text-muted">Quên mật khẩu?</a>
                        </div>
                        <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-brand w-100 py-2 mt-2">Đăng Nhập</button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted">Chưa có tài khoản?</span>
                    <a th:href="@{/register}" class="text-decoration-none fw-semibold text-primary"> Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
