<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0d2847; background-image: url('/images/wave-bg.png'); background-attachment: scroll; background-size: 100% auto; min-height: 100vh; display: flex; align-items: center; font-family: 'Montserrat', sans-serif;}
        .card-auth { border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: none; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-auth p-4 p-md-5 text-center">
                <i class="bi bi-envelope-at-fill text-danger fs-1 mb-3"></i>
                <h4 class="fw-bold mb-2" style="color: #004ea2;">Quên Mật Khẩu?</h4>
                <p class="text-muted small">Nhập email của bạn, chúng tôi sẽ gửi mã OTP gồm 6 chữ số để đặt lại mật khẩu.</p>
                
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                <form th:action="@{/forgot-password}" method="post" class="mt-3">
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control py-2" placeholder="Nhập email của bạn..." required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold" style="background-color: #d8232a;">Gửi Mã OTP</button>
                </form>
                <div class="mt-4"><a th:href="@{/login}" class="text-decoration-none small">Quay lại Đăng nhập</a></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
