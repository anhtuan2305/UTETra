<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng Sàn - UTETra Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #0b1f3a;
            --brand-blue: #0d6efd;
            --brand-red: #c82333;
            --brand-black: #111827;
            --brand-gray: #64748b;
            --brand-light: #f8fafc;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--brand-navy);
            background-image: url('/images/wave-bg.png');
            background-repeat: repeat-y;
            background-size: 100% auto;
            min-height: 100vh;
            color: var(--brand-black);
        }
        .admin-wrapper {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
            padding: 2.5rem;
        }
        .text-brand-navy { color: var(--brand-navy) !important; }
        .text-brand-red { color: var(--brand-red) !important; }
        
        /* Định nghĩa Badge chuẩn 4 màu: Xanh dương, Đỏ, Đen, Trắng/Xám */
        .badge-status-new {
            background-color: #ffffff;
            color: var(--brand-black);
            border: 1.5px solid #cbd5e1;
            font-weight: 600;
        }
        .badge-status-prep {
            background-color: var(--brand-navy);
            color: #ffffff;
            font-weight: 600;
        }
        .badge-status-ship {
            background-color: var(--brand-blue);
            color: #ffffff;
            font-weight: 600;
        }
        .badge-status-done {
            background-color: var(--brand-black);
            color: #ffffff;
            font-weight: 600;
        }
        .badge-status-cancel {
            background-color: var(--brand-red);
            color: #ffffff;
            font-weight: 600;
        }

        .btn-brand-back {
            color: var(--brand-navy);
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-brand-back:hover {
            background-color: var(--brand-navy);
            color: #ffffff;
            border-color: var(--brand-navy);
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="admin-wrapper">

            <!-- Tiêu đề & Điều hướng -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div class="d-flex align-items-center gap-3">
                    <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-brand-back rounded-pill px-3 fw-bold">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                    <span class="fs-4 fw-bold text-brand-navy text-uppercase">Lịch Sử Giao Dịch & Đơn Hàng Toàn Sàn</span>
                </div>
            </div>

            <!-- Bảng dữ liệu Đơn hàng -->
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr class="text-secondary small">
                            <th>MÃ ĐƠN</th>
                            <th>THỜI GIAN</th>
                            <th>KHÁCH HÀNG</th>
                            <th>QUÁN BÁN</th>
                            <th>TỔNG TIỀN</th>
                            <th>PHƯƠNG THỨC</th>
                            <th class="text-end">TRẠNG THÁI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center text-muted py-4">Chưa có giao dịch đơn hàng nào trên hệ thống.</td>
                        </tr>
                        <tr th:each="order : ${orders}">
                            <!-- Mã đơn (Xanh dương) -->
                            <td class="fw-bold text-primary">#[[${order.id}]]</td>

                            <!-- Thời gian (Đen/Xám) -->
                            <td class="small text-dark fw-semibold" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>

                            <!-- Khách hàng (Đen) -->
                            <td>
                                <strong class="text-dark" th:text="${order.account != null ? order.account.email : 'Khách vãng lai'}">email</strong>
                                <div class="text-muted small" th:text="${order.address != null ? order.address.receiverName + ' (' + order.address.phone + ')' : ''}"></div>
                            </td>

                            <!-- Quán bán (Đỏ thương hiệu) -->
                            <td>
                                <span class="fw-bold text-brand-red" th:text="${order.shop != null ? order.shop.shopName : 'N/A'}">Tên Quán</span>
                            </td>

                            <!-- Tổng tiền (Đỏ thương hiệu) -->
                            <td class="fw-bold text-brand-red" th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>

                            <!-- Phương thức (Trắng viền xám) -->
                            <td>
                                <span class="badge bg-white text-dark border px-2 py-1" th:text="${order.paymentMethod}">COD</span>
                            </td>

                            <!-- Trạng thái: 100% Xanh dương - Đen - Trắng - Đỏ -->
                            <td class="text-end">
                                <span th:if="${order.status == 'NEW'}" class="badge badge-status-new px-3 py-2 rounded-pill">
                                    <i class="bi bi-hourglass-split me-1"></i> Chờ Xác Nhận
                                </span>
                                <span th:if="${order.status == 'PREPARING'}" class="badge badge-status-prep px-3 py-2 rounded-pill">
                                    <i class="bi bi-cup-hot me-1"></i> Đang Pha Chế
                                </span>
                                <span th:if="${order.status == 'SHIPPING'}" class="badge badge-status-ship px-3 py-2 rounded-pill">
                                    <i class="bi bi-bicycle me-1"></i> Đang Giao Hàng
                                </span>
                                <span th:if="${order.status == 'COMPLETED'}" class="badge badge-status-done px-3 py-2 rounded-pill">
                                    <i class="bi bi-check-circle-fill me-1"></i> Giao Thành Công
                                </span>
                                <span th:if="${order.status == 'CANCELLED'}" class="badge badge-status-cancel px-3 py-2 rounded-pill">
                                    <i class="bi bi-x-circle me-1"></i> Đã Hủy Đơn
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
