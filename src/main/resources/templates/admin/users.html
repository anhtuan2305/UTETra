<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng - UTETra Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b1f3a; background-image: url('/images/wave-bg.png'); background-repeat: repeat-y; background-size: 100% auto; min-height: 100vh; }
        .admin-wrapper { background: rgba(255, 255, 255, 0.98); border-radius: 20px; box-shadow: 0 10px 35px rgba(0,0,0,0.4); padding: 2.5rem; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="admin-wrapper">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div>
                    <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary rounded-pill me-2"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
                    <span class="fs-4 fw-bold text-primary">DANH SÁCH NGƯỜI DÙNG HỆ THỐNG</span>
                </div>
                <!-- Form tìm kiếm user -->
                <form th:action="@{/admin/users}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm rounded-pill" placeholder="Tìm kiếm theo email...">
                    <button type="submit" class="btn btn-sm btn-primary rounded-pill px-3">Tìm</button>
                </form>
            </div>

            <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Email Tài Khoản</th>
                            <th>Vai Trò (Role)</th>
                            <th>Trạng Thái Kích Hoạt</th>
                            <th class="text-end">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${userPage.content}">
                            <td>#[[${user.id}]]</td>
                            <td class="fw-semibold" th:text="${user.email}">user@example.com</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : (${user.role == 'VENDOR'} ? 'bg-primary' : 'bg-secondary')"
                                      th:text="${user.role}">USER</span>
                            </td>
                            <td>
                                <span th:if="${user.isActive}" class="badge bg-success">Đang hoạt động</span>
                                <span th:if="${!user.isActive}" class="badge bg-danger">Đang bị khóa</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/users/toggle-status}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${user.id}">
                                    <button type="submit" class="btn btn-sm rounded-pill px-3 fw-bold"
                                            th:classappend="${user.isActive} ? 'btn-outline-danger' : 'btn-outline-success'">
                                        [[${user.isActive} ? 'Khóa' : 'Kích hoạt']]
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
