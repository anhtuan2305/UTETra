<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Gian Hàng - UTETra Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0b1f3a; 
            background-image: url('/images/wave-bg.png'); 
            background-repeat: repeat-y; 
            background-size: 100% auto; 
            min-height: 100vh; 
        }
        .admin-wrapper { 
            background: rgba(255, 255, 255, 0.98); 
            border-radius: 20px; 
            box-shadow: 0 10px 35px rgba(0,0,0,0.4); 
            padding: 2.5rem; 
        }
    </style>
</head>
<body th:attr="data-signed-in=${#authorization.expression('isAuthenticated()') ? 'true' : null}">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="admin-wrapper">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div>
                    <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary rounded-pill me-2">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                    <span class="fs-4 fw-bold text-danger">QUẢN LÝ GIAN HÀNG & CẤP PHÉP HOẠT ĐỘNG</span>
                </div>
                
                <!-- Thanh tìm kiếm quán -->
                <form th:action="@{/admin/shops}" method="get" class="d-flex">
                    <div class="input-group">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm rounded-start-pill ps-3" placeholder="Tìm theo tên quán...">
                        <button class="btn btn-sm btn-primary rounded-end-pill px-3" style="background-color: #004ea2;" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>

            <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Logo</th>
                            <th>Tên Quán Trà Sữa</th>
                            <th>Chủ Sở Hữu</th>
                            <th>Đánh Giá</th>
                            <th>Trạng Thái</th>
                            <th class="text-end">Thao Tác Cấp Phép</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${shopPage == null or #lists.isEmpty(shopPage.content)}">
                            <td colspan="6" class="text-center text-muted py-4">Không tìm thấy gian hàng nào.</td>
                        </tr>
                        <tr th:each="shop : ${shopPage.content}">
                            <td>
                                <img th:src="${shop.logoUrl != null and !shop.logoUrl.isEmpty() ? (shop.logoUrl.startsWith('http') or shop.logoUrl.startsWith('/') ? shop.logoUrl : '/' + shop.logoUrl) : 'https://placehold.co/100x100?text=Shop'}" 
                                     onerror="this.onerror=null; this.src='https://placehold.co/100x100?text=Shop';"
                                     class="rounded-circle border" 
                                     style="width: 48px; height: 48px; object-fit: cover;" alt="">
                            </td>
                            <td>
                                <strong class="text-primary" th:text="${shop.shopName}">Quán</strong>
                                <div class="text-muted small text-truncate" style="max-width: 250px;" th:text="${shop.description}">Mô tả</div>
                            </td>
                            <td class="small" th:text="${shop.owner != null ? shop.owner.email : 'N/A'}">owner@gmail.com</td>
                            <td>
                                <span class="badge bg-warning text-dark">
                                    <i class="bi bi-star-fill me-1"></i>[[${shop.rating}]]
                                </span>
                            </td>
                            <td>
                                <span th:if="${shop.status == 'ACTIVE'}" class="badge bg-success-subtle text-success border border-success px-3 py-1 rounded-pill">
                                    <i class="bi bi-check-circle-fill me-1"></i>Đang kinh doanh
                                </span>
                                <span th:if="${shop.status == 'PENDING'}" class="badge bg-warning-subtle text-warning border border-warning px-3 py-1 rounded-pill">
                                    <i class="bi bi-hourglass-split me-1"></i>Chờ cấp phép
                                </span>
                                <span th:if="${shop.status != 'ACTIVE' and shop.status != 'PENDING'}" class="badge bg-danger-subtle text-danger border border-danger px-3 py-1 rounded-pill">
                                    <i class="bi bi-slash-circle me-1"></i>Đã bị cấm
                                </span>
                            </td>
                            <td class="text-end">
                                <!-- Trường hợp 1: Quán mới đăng ký đang chờ duyệt (PENDING) -->
                                <div th:if="${shop.status == 'PENDING'}" class="d-inline-flex gap-2">
                                    <form th:action="@{/admin/shops/update-status}" method="post">
                                        <input type="hidden" name="shopId" th:value="${shop.id}">
                                        <input type="hidden" name="status" value="ACTIVE">
                                        <button type="submit" class="btn btn-sm btn-success rounded-pill px-3 fw-bold">
                                            <i class="bi bi-check-lg me-1"></i>Duyệt Cấp Phép
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/shops/update-status}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn từ chối hồ sơ đăng ký của quán này?');">
                                        <input type="hidden" name="shopId" th:value="${shop.id}">
                                        <input type="hidden" name="status" value="BANNED">
                                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                            <i class="bi bi-x-lg me-1"></i>Từ Chối
                                        </button>
                                    </form>
                                </div>

                                <!-- Trường hợp 2: Quán đã được duyệt hoặc đang bị cấm -->
                                <div th:unless="${shop.status == 'PENDING'}">
                                    <form th:action="@{/admin/shops/update-status}" method="post" class="d-inline"
                                          th:onsubmit="${shop.status == 'ACTIVE'} ? 'return confirm('Bạn có chắc chắn muốn cấm quán này kinh doanh?');' : ''">
                                        <input type="hidden" name="shopId" th:value="${shop.id}">
                                        <input type="hidden" name="status" th:value="${shop.status == 'ACTIVE'} ? 'BANNED' : 'ACTIVE'">
                                        <button type="submit" class="btn btn-sm rounded-pill px-3 fw-bold"
                                                th:classappend="${shop.status == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                                            [[${shop.status == 'ACTIVE'} ? 'Cấm quán (Ban)' : 'Kích hoạt lại']]
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Phân trang danh sách quán -->
            <div class="d-flex justify-content-center mt-4" th:if="${totalPages > 1}">
                <nav>
                    <ul class="pagination pagination-sm shadow-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/shops(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/shops(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/shops(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/live-orders.js"></script></body>
</html>
