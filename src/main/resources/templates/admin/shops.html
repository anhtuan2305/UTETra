<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Gian Hàng - UTETra Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b1f3a; background-image: url('/images/wave-bg.png'); background-repeat: repeat-y; background-size: 100% auto; min-height: 100vh; }
        .admin-wrapper { background: rgba(255, 255, 255, 0.98); border-radius: 20px; box-shadow: 0 10px 35px rgba(0,0,0,0.4); padding: 2.5rem; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="admin-wrapper">
            
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom flex-wrap gap-2">
                <div>
                    <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-secondary rounded-pill me-2"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
                    <span class="fs-4 fw-bold text-danger">QUẢN LÝ GIAN HÀNG & CẤP PHÉP HOẠT ĐỘNG</span>
                </div>
            </div>

            <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Logo</th>
                            <th>Tên Quán Trà Sữa</th>
                            <th>Chủ Sở Hữu</th>
                            <th>Đánh Giá</th>
                            <th>Trạng Thái</th>
                            <th class="text-end">Cấp Phép / Khóa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="shop : ${shopPage.content}">
                            <td><img th:src="${shop.logoUrl}" class="rounded-circle border" style="width: 45px; height: 45px; object-fit: cover;" alt=""></td>
                            <td>
                                <strong class="text-primary" th:text="${shop.shopName}">Quán</strong>
                                <div class="text-muted small" th:text="${shop.description}">Mô tả</div>
                            </td>
                            <td class="small" th:text="${shop.owner != null ? shop.owner.email : 'N/A'}">owner@gmail.com</td>
                            <td><span class="badge bg-warning text-dark"><i class="bi bi-star-fill me-1"></i>[[${shop.rating}]]</span></td>
                            <td>
                                <span th:if="${shop.status == 'ACTIVE'}" class="badge bg-success">Đang kinh doanh</span>
                                <span th:if="${shop.status == 'BANNED'}" class="badge bg-danger">Đã bị cấm</span>
                                <span th:if="${shop.status == 'PENDING'}" class="badge bg-warning text-dark">Chờ cấp phép</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/admin/shops/update-status}" method="post" class="d-inline">
                                    <input type="hidden" name="shopId" th:value="${shop.id}">
                                    <input type="hidden" name="status" th:value="${shop.status == 'ACTIVE'} ? 'BANNED' : 'ACTIVE'">
                                    <button type="submit" class="btn btn-sm rounded-pill px-3 fw-bold"
                                            th:classappend="${shop.status == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                                        [[${shop.status == 'ACTIVE'} ? 'Cấm quán (Ban)' : 'Cấp phép mở bán (License)']]
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
