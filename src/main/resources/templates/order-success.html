<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công - UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            color: #333;
            min-height: 100vh;
            margin: 0;
            background-color: #0d2847;
            background-image: url('/images/wave-bg.png');
            background-repeat: repeat-y;
            background-position: center top;
            background-size: 100% auto;
            background-attachment: scroll;
        }

        .success-box {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            padding: 4rem 2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="success-box">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4.5rem;"></i>
                    <h2 class="fw-bold mt-3 mb-2" style="color: #004ea2;">ĐẶT HÀNG THÀNH CÔNG!</h2>
                    <p class="text-secondary">Cảm ơn bạn đã lựa chọn trà sữa truyền thống tại UTETra.</p>
                    
                    <div class="p-3 bg-light rounded-3 my-4 d-inline-block px-4">
                        Mã đơn hàng của bạn: <strong class="text-danger fs-5">#[[${orderId}]]</strong>
                    </div>

                    <p class="small text-muted mb-4">
                        Quán đang chuẩn bị nguyên liệu và sẽ sớm giao đến tay bạn. Shipper sẽ liên hệ qua số điện thoại bạn cung cấp khi giao hàng.
                    </p>

                    <div class="d-flex gap-3 justify-content-center">
                        <a th:href="@{/}" class="btn btn-outline-primary rounded-pill px-4 fw-bold">Về Trang Chủ</a>
                        <a th:href="@{/orders}" class="btn btn-danger rounded-pill px-4 fw-bold" style="background-color: #d8232a;">Xem Đơn Mua</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
